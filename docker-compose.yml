version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: webapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webapp_db
      POSTGRES_USER: webapp_user
      POSTGRES_PASSWORD: webapp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp_user -d webapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - webapp-net

  # ── Node.js Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    container_name: webapp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: webapp_db
      DB_USER: webapp_user
      DB_PASSWORD: webapp_pass
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - webapp-net

  # ── React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: webapp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webapp-net

volumes:
  postgres_data:
    name: webapp-postgres-data

networks:
  webapp-net:
    name: webapp-network
    driver: bridge
