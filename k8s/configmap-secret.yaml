---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: webapp
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres-service.webapp.svc.cluster.local"  # <-- ПОЛНЫЙ DNS
  DB_PORT: "5432"
  DB_NAME: "webapp_db"
  DB_USER: "webapp_user"
  CORS_ORIGIN: "https://johnkarlo.ru"  # <-- ВАШ ДОМЕН
  LOG_LEVEL: "info"

---
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secrets
  namespace: webapp
type: Opaque
stringData:
  DB_PASSWORD: "webapp_pass_prod_CHANGE_ME"
  JWT_SECRET: "super-secret-jwt-key-CHANGE_ME_IN_PRODUCTION"
  POSTGRES_PASSWORD: "webapp_pass_prod_CHANGE_ME"