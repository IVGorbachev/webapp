---
# ConfigMap for non-sensitive config
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: webapp
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "webapp_db"
  DB_USER: "webapp_user"
  CORS_ORIGIN: "http://192.168.0.243:30266"
  LOG_LEVEL: "info"

---
# Secret for sensitive data (base64 encoded)
# In production, use External Secrets Operator or Vault
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secrets
  namespace: webapp
type: Opaque
stringData:
  DB_PASSWORD: "webapp_pass"
  JWT_SECRET: "super-secret-jwt-key-CHANGE_ME_IN_PRODUCTION"
  POSTGRES_PASSWORD: "webapp_pass"
