---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-frontend
  namespace: webapp
  labels:
    app: webapp-frontend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: webapp-frontend
        version: "1.0.0"
    spec:
      containers:
        - name: frontend
          image: gorbachevivan72/webapp-frontend:latest  # <-- ИЗМЕНИТЕ
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: webapp
  labels:
    app: webapp-frontend
spec:
  selector:
    app: webapp-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP