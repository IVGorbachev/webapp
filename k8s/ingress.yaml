apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-ingress
  namespace: webapp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure   # 👈 Для Traefik
    # traefik.ingress.kubernetes.io/router.tls: "true"                  # 👈 Для HTTPS
    # kubernetes.io/ingress.class: "nginx"  # 👈 УДАЛИТЬ или заменить на traefik
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"  # 👈 УДАЛИТЬ (пока нет cert-manager)
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"  # 👈 УДАЛИТЬ
    #nginx.ingress.kubernetes.io/proxy-read-timeout: "60"  # 👈 УДАЛИТЬ
spec:
  # tls:  # 👈 ЗАКОММЕНТИРОВАТЬ (пока нет сертификата)
  #   - hosts:
  #       - johnkarlo.ru
  #     secretName: johnkarlo-tls-secret
  rules:
    - host: johnkarlo.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80