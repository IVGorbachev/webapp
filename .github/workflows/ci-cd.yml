name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ivgorbachev/webapp

jobs:
  # ── Test Backend ─────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: webapp_test_db
          POSTGRES_USER: webapp_user
          POSTGRES_PASSWORD: webapp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run tests
        run: npm test -- --coverage --forceExit
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: webapp_test_db
          DB_USER: webapp_user
          DB_PASSWORD: webapp_pass
          JWT_SECRET: test-secret

      - name: Upload coverage
        uses: codecov/codecov-action@v4  # 👈 Обновил версию с v3 на v4

  # ── Test Frontend ────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run tests
        run: npm test -- --coverage --watchAll=false
        working-directory: ./frontend
        env:
          CI: true

  # ── Build & Push Docker Images ───────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          target: production
          build-args: |
            REACT_APP_API_URL=http://johnkarlo.ru
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Kubernetes ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 🔥 ИЗМЕНЕНИЕ 1: Конфигурация kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config  # 👈 Добавил права доступа

      # 🔥 ИЗМЕНЕНИЕ 2: Проверка подключения к кластеру
      - name: Verify cluster connection
        run: |
          kubectl get nodes
          kubectl get namespaces

      # 🔥 ИЗМЕНЕНИЕ 3: Создание namespace
      - name: Create namespace
        run: |
          kubectl create namespace webapp --dry-run=client -o yaml | kubectl apply -f -

      # 🔥 ИЗМЕНЕНИЕ 4: Применение манифестов
      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/ -n webapp

      # 🔥 ИЗМЕНЕНИЕ 5: Обновление образов с защитой от ошибок
      - name: Update image tags
        run: |
          SHA=${{ github.sha }}
          SHORT_SHA=${SHA::7}
          # || true - чтобы не падало, если деплоймент еще не существует
          kubectl set image deployment/webapp-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${SHORT_SHA} \
            -n webapp || true
          kubectl set image deployment/webapp-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${SHORT_SHA} \
            -n webapp || true

      # 🔥 ИЗМЕНЕНИЕ 6: Ожидание с защитой от ошибок
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/webapp-backend -n webapp --timeout=5m || true
          kubectl rollout status deployment/webapp-frontend -n webapp --timeout=5m || true

      # 🔥 ИЗМЕНЕНИЕ 7: Проверка с выводом Ingress
      - name: Verify deployment
        run: |
          kubectl get pods -n webapp
          kubectl get services -n webapp
          kubectl get ingress -n webapp  # 👈 Добавил проверку Ingress